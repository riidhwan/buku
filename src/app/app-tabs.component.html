<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="library" [attr.href]="routeTargets.library().url">
      <ion-icon name="library-outline" aria-hidden="true"></ion-icon>
      <ion-label>Library</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="explore" [attr.href]="routeTargets.explore().url">
      <ion-icon name="compass-outline" aria-hidden="true"></ion-icon>
      <ion-label>Explore</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="more" [attr.href]="routeTargets.more().url">
      <ion-icon name="menu-outline" aria-hidden="true"></ion-icon>
      <ion-label>More</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
